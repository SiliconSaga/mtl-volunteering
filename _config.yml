title: MTL Volunteering
description: >-
  The volunteer guide for the Mountain Top League — an all-volunteer
  organization serving the children of West Orange, NJ since 1959. League
  house, gear, sportsmanship, and safety, across all MTL sports.
# Served at the volunteering subdomain (CNAME file): the site lives at the
# domain root, so baseurl stays empty and all internal links resolve from /.
url: "https://volunteering.mountaintopleague.com"
baseurl: ""

permalink: pretty
markdown: kramdown

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: page
